name: radar-pricing

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: radar-pricing:latest
    container_name: radar-pricing
    restart: unless-stopped

    ports:
      - "${APP_PORT:-3005}:3000"

    environment:
      # /mock = base fictícia (padrão). /data = extrato das planilhas.
      NUXT_PUBLIC_DATA_BASE: ${NUXT_PUBLIC_DATA_BASE:-/mock}

    # Endurecimento: sistema de arquivos somente leitura, sem privilégios extras
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
